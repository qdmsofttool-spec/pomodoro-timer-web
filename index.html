<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="container">
    <h1>Pomodoro</h1>
    <p class="clock" id="clock" aria-label="현재 시간"></p>

    <section class="timer" aria-label="남은 시간">
      <span class="time" id="time">25:00</span>
    </section>

    <section class="controls" aria-label="타이머 컨트롤">
      <button type="button" class="btn btn-start" id="start">시작</button>
      <button type="button" class="btn btn-stop" id="stop">정지</button>
      <button type="button" class="btn btn-reset" id="reset">초기화</button>
    </section>

    <button type="button" class="btn btn-settings" id="settings">설정</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
